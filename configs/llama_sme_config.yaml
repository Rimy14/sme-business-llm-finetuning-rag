# Llama 3 8B Instruct QLoRA Configuration (Tesla T4 Optimized)
model_name_or_path: "meta-llama/Meta-Llama-3-8B-Instruct"
dataset_name: "data/processed/train_v1.json"
val_dataset_name: "data/processed/val_v1.json"
output_dir: "models/v1/llama_sme_v1"

# Quantization (4-bit NF4)
bitsandbytes:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "float16"

# LoRA Hyperparameters
peft:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training Arguments (T4 Budget & Anti-Crash)
training:
  max_train_samples: 2000
  max_val_samples: 200
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4 # Effective batch size = 16
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  fp16: true
  bf16: false
  logging_steps: 10
  eval_strategy: "steps"
  eval_steps: 50
  save_strategy: "steps"
  save_steps: 100
  save_total_limit: 2
  max_seq_length: 512
  seed: 42
